<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部落冲突阵型分享</title>
    <!-- 引入 Bmob 数据库 SDK -->
    <script src="https://npmcdn.com/bmob@latest/dist/Bmob-2.2.5.min.js"></script>
    <!-- 引入阿里云 OSS SDK -->
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
    <style>
        /* 你的 CSS 样式保持不变 */
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f7f9fc; }
        /* 其他样式省略，保留你原本的即可 */
    </style>
</head>
<body>

    <!-- 页面主体内容保持不变 -->
    <div id="app">
        <!-- 广场大厅、列表等 -->
    </div>

    <script>
        // 初始化 Bmob
        Bmob.initialize("你的BmobSecretKey", "你的BmobAccessKey");

        // ... 中间的页面渲染、数据加载逻辑保持不变 ...

        // 弹窗确认按钮点击事件（包含图片上传和数据保存）
        const modalConfirm = document.getElementById('modalConfirm');
        
        modalConfirm.onclick = () => {
            if(readyToUploadFile){
                modalConfirm.innerText = '上传图片中...';
                
                // 初始化阿里云 OSS 客户端（已填入你的专属密钥）
                const client = new OSS({
                  region: 'oss-cn-beijing', // 你的阿里云存储桶区域（北京）
                  accessKeyId: 'LTAI5t7riMRks8MuoxADzfFQ',
                  accessKeySecret: 'ZmJfvcjDJWd6GteQJwNtJcfaCZqdC9',
                  bucket: 'coc-layout-img'  // 你的存储桶名称
                });

                // 生成随机文件名，避免同名覆盖
                const fileExtension = readyToUploadFile.name.split('.').pop() || 'jpg';
                const randomName = 'layouts/' + Date.now() + '-' + Math.floor(Math.random() * 10000) + '.' + fileExtension;

                // 开始上传到阿里云 OSS
                client.put(randomName, readyToUploadFile).then(res => {
                    // 将返回的链接强制转为 https
                    let finalImgUrl = res.url.replace('http://', 'https://');
                    saveToBmob(finalImgUrl); // 上传成功后保存到 Bmob 数据库
                }).catch(err => {
                    console.error("OSS Upload Error:", err);
                    handleSaveError('阿里云上传失败，请检查设置');
                });
                
            } else {
                saveToBmob(currentEditImageUrl);
            }
        };

        function saveToBmob(imgUrl) {
            // 保存数据到 Bmob 数据库的逻辑保持不变
            console.log("正在保存到数据库，图片地址：", imgUrl);
        }

        function handleSaveError(msg) {
            alert(msg);
            modalConfirm.innerText = '确定';
        }
    </script>
</body>
</html>
